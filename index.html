<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="todolist Background Removed.png">
</head>
<body>
  <form id="toDo">
    <h2 id="heading">To-Do List Manager <img src="todolist Background Removed.png" alt=""></h2>
<input type="text" id="inputBox" placeholder="What's the task?">
<button type="submit" id="addTaskbtn">ADD</button>

<ul id="tasks"></ul>
<p id="message"></p>

<div class="taskCount">
<p>Total tasks: <span id="total">0</span></p>
<p>Completed tasks: <span id="completed">0</span></p>

</div>


  </form> 
    <script src="script.js"></script>
</body>
</html>
